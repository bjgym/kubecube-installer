# if install kubecube on pivot cluster
INSTALL_KUBECUBE_PIVOT="true"

# install the platform's member side into this cluster instead of the pivot.
#
# A member is managed by a pivot elsewhere: it renders the same chart with the
# pivot's own components off and registers itself with the pivot, so nothing is
# pushed into it from the other side. Set the settings below with it.
INSTALL_KUBECUBE_MEMBER="false"

# the pivot's reachable API NodePort, "<pivotIP>:30443"
PIVOT_CUBE_HOST=""

# a kubeconfig for the pivot, which the member's warden reports to, and one for
# this cluster
PIVOT_KUBECONFIG="/root/.kube/config"
MEMBER_KUBECONFIG="/etc/kubernetes/admin.conf"

# the name this cluster registers under; empty means the hostname
MEMBER_CLUSTER_NAME=""

# if install k8s
INSTALL_KUBERNETES="true"

# which distribution installs the cluster
# "k0s"     : the k0s distribution. Single node only for now: k0s brings its own
#             containerd, so no external container runtime is needed, and the
#             whole install works from the offline bundle.
# "kubeadm" : the existing kubeadm path, which needs CONTAINER_RUNTIME below.
KUBERNETES_DISTRO="k0s"

# k0s release, used when KUBERNETES_DISTRO="k0s".
#
# Pinned to the last patch of the 1.28 line. Two versions move together here:
# k0s 1.28 is the last k0s line whose control-plane taint key is still "master"
# (1.33 moved to "control-plane"), and Cilium 1.16 is the last Cilium line that
# supports Kubernetes 1.28. Raise Kubernetes and Cilium together, never alone.
K0S_VERSION="1.28.15"

# cluster cni.
#   k0s     : "kuberouter" (bundled, no extra images), "calico" (k0s installs it),
#             or "cilium" (this installer installs the bundled chart)
#   kubeadm : "calico"
CNI="cilium"

# cilium settings, used when CNI="cilium"
CILIUM_VERSION="1.16.19"

# run the cluster without kube-proxy: k0s' kube-proxy is disabled and cilium takes
# over service handling. Set to "false" to keep kube-proxy and let cilium handle
# the dataplane only. Both paths are wired; this one is the default.
CILIUM_KUBE_PROXY_REPLACEMENT="true"

# Deprecated: this plugin here is only for consistency certification.
#
# there are four node mode below:
# "master" : node will be installed as a master of cluster
# "node-join-master" : node will be install as a worker of cluster to join master
# "control-plane-master" : node will be installed as a master to control plane of cluster
# "node-join-control-plane" : node will be installed as a master to join control plane
NODE_MODE="master"

# zone has two choice
# 1. "cn" : in mainland
# 2. "others" : out of mainland
ZONE="cn"

# k8s version you want to install
# support now is: 1.19.13, 1.20.9, 1.21.2, 1.22.2, 1.23.5, 1.24.7, 1.25.3, 1.26.0
KUBERNETES_VERSION="1.23.5"

# namespace that all kubecube components will deploy
# default is 'kubecube-system'
INSTALL_NAMESPACE="kubecube-system"

# +optional
# Deprecated: this plugin here is only for consistency certification.
#
# must be set when NODE_MODE="control-plane-master"
# or "node-join-control-plane"
CONTROL_PLANE_ENDPOINT="" #{ip}:{port} , dns

# +optional
# Deprecated: this plugin here is only for consistency certification.
#
# KUBERNETES_BIND_ADDRESS generally is node_ip
# can be set when NODE_MODE="master" ot "control-plane-master"
# default value is $(hostname -I |awk '{print $1}')
KUBERNETES_BIND_ADDRESS="" #{node_ip}

#######################################################################
# third part apps config
# used when INSTALL_KUBECUBE_PIVOT="true"
#######################################################################

# if install metric server
METRIC_SERVER_ENABLE="true"

# if install ingress controller
INGRESS_CONTROLLER_ENABLE="true"

# if install local path storage
LOCAL_PATH_STORAGE_ENABLE="true"

# if install the cloud shell and the console front end.
#
# The arm64 offline bundle cannot build either of them yet (the front end's
# node-sass has no arm64 binding, and the shell's base image is EOL), so the
# bundle ships its own install.conf with both set to "false". Online installs
# keep them on.
CLOUDSHELL_ENABLE="true"
FRONTEND_ENABLE="true"

#######################################################################
# Deprecated: this plugins here are only for consistency certification.
#
# ssh config
# used when NODE_MODE="node-join-master" or node-join-control-plane
#######################################################################

# +optional
# master ip means master node ip of cluster
MASTER_IP=""

# +optional
# the user who can access master node, it can be empty
SSH_USER="root"

# +optional
# the port specified to access master node, it can be empty
SSH_PORT=22

# +optional
# must be empty when ACCESS_PRIVATE_KEY_PATH set
# password for master user to access master node
ACCESS_PASSWORD=""

# +optional
# must be empty when ACCESS_PASSWORD set
# ACCESS_PRIVATE_KEY for master user to access master node
ACCESS_PRIVATE_KEY_PATH="/root/.ssh/id_rsa"

#######################################################################
# container runtime config
# if value is docker, then use docker as container runtime
# else if value is containerd, then use containerd as container runtime
#
# k0s brings its own containerd, so this value is unused when
# KUBERNETES_DISTRO="k0s".
#######################################################################
CONTAINER_RUNTIME="docker"

#######################################################################
# offline install
#
# "false": entry.sh downloads the manifests and the chart, and the installer
#          pulls what it needs from the network (the released behaviour).
# "true" : everything comes from a bundle staged by build-offline-bundle.sh:
#          the distribution binary, every image, the charts and the binaries.
#          No network access is required, and none is attempted.
#
# The bundle ships its own copy of this file with OFFLINE="true" and the image
# tag it was built with, so a bundle install does not depend on the values here.
#######################################################################
OFFLINE="false"

# where the bundle is staged, used when OFFLINE="true"
OFFLINE_BUNDLE_DIR="/opt/kubecube-offline"
